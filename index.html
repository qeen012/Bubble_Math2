<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛動物泡泡救援大冒險</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', '微軟正黑體', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      /* 莫蘭迪柔和低彩度漸層 */
      background: linear-gradient(135deg, #d8e2dc 0%, #ffe5ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-card {
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 15px 35px rgba(142, 154, 175, 0.2);
      width: 100%;
      max-width: 440px;
      padding: 22px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部狀態列 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f1de;
      padding: 10px 14px;
      border-radius: 18px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #606c38;
    }

    .timer-pill {
      background: #f2cc8f;
      color: #3d405b;
      padding: 4px 10px;
      border-radius: 14px;
      font-weight: 700;
    }

    .ball-count {
      background: #e9edc9;
      padding: 4px 10px;
      border-radius: 14px;
      color: #2b9348;
    }

    /* 泡泡拯救區 */
    .bubble-stage {
      height: 190px;
      background: #f8f9fa;
      border-radius: 24px;
      border: 2px dashed #d8e2dc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: background 0.3s;
    }

    .bubble-stage.boss-mode {
      background: #fef9c3;
      border: 3px solid #f59e0b;
    }

    .target-bubble {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(181, 131, 141, 0.2);
      border: 4px solid #b5838d;
      box-shadow: inset -6px -6px 15px rgba(181, 131, 141, 0.25), 0 10px 20px rgba(0,0,0,0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: floatBubble 3s infinite ease-in-out alternate;
    }

    /* 稀有動物金燦巨型大泡泡 */
    .target-bubble.boss-bubble {
      border: 5px solid #f59e0b;
      background: rgba(251, 191, 36, 0.25);
      width: 135px;
      height: 135px;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5), inset -8px -8px 20px rgba(245, 158, 11, 0.3);
    }

    @keyframes floatBubble {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .animal-inside {
      font-size: 58px;
      line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
    }

    .animal-inside.boss-animal {
      font-size: 72px;
    }

    /* 題目區 */
    .question-box {
      background: #f4f1de;
      border-radius: 20px;
      padding: 14px 8px;
      margin: 14px 0 10px;
      font-size: 36px;
      font-weight: 700;
      color: #3d405b;
      letter-spacing: 1px;
    }

    .question-box.boss-q {
      background: #fef3c7;
      color: #b45309;
      font-size: 30px;
      border: 2px solid #f59e0b;
    }

    /* 砲台按鈕區 (固定三個大按鈕) */
    .ammo-options {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      width: 100%;
    }

    .ammo-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #e07a5f;
      color: white;
      border: none;
      font-size: 34px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 0 #c1121f, 0 10px 18px rgba(224, 122, 95, 0.25);
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ammo-btn:nth-child(1) { background: #81b29a; box-shadow: 0 7px 0 #3d5a80; }
    .ammo-btn:nth-child(2) { background: #f2cc8f; color: #3d405b; box-shadow: 0 7px 0 #e07a5f; }
    .ammo-btn:nth-child(3) { background: #3d405b; box-shadow: 0 7px 0 #1d3557; }

    .ammo-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #3d405b;
    }

    /* 圖鑑 */
    .pokedex-box {
      margin-top: 16px;
      background: #f8f9fa;
      border-radius: 16px;
      padding: 10px;
      font-size: 13px;
      color: #6c757d;
      font-weight: 600;
    }

    .pokedex-list {
      font-size: 24px;
      margin-top: 4px;
      min-height: 32px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 彈窗 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-radius: 32px;
      z-index: 10;
    }

    /* 極簡分級證書卡片 */
    .medal-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 3px solid #f59e0b;
      border-radius: 24px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
      width: 100%;
      margin: 10px 0;
      text-align: center;
    }

    .medal-title {
      font-size: 22px;
      font-weight: 700;
      color: #b45309;
      margin: 4px 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .medal-stat {
      font-size: 18px;
      color: #451a03;
      font-weight: 600;
      margin: 8px 0;
    }

    .rare-unlocked-box {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 14px;
      padding: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: #78350f;
    }

    .btn-start {
      background: #e07a5f;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 35px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c1121f;
      margin-top: 14px;
    }

    .btn-reset-time {
      background: transparent;
      color: #a0aec0;
      border: none;
      font-size: 12px;
      margin-top: 12px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- 頂部狀態列 -->
    <div class="status-bar">
      <span class="timer-pill">⏳ <span id="time-left">05:00</span></span>
      <span style="font-size: 13px; font-weight:700;" id="stage-progress">進度: 1/7 題</span>
      <span class="ball-count">⭐ 救出: <span id="saved-count">0</span> 隻</span>
    </div>

    <!-- 泡泡拯救區 -->
    <div class="bubble-stage" id="bubble-stage">
      <div class="target-bubble" id="target-bubble">
        <div class="animal-inside" id="current-animal">🐶</div>
      </div>
    </div>

    <!-- 題目區域 -->
    <div class="question-box" id="question">45 + 38 = ?</div>

    <div style="font-size: 13px; color: #8d99ae; font-weight: 600;" id="sub-hint">
      🎯 發射正確的數字泡泡拯救小動物！
    </div>

    <!-- 下方三個大發射砲台 -->
    <div style="margin-top: 10px;">
      <div class="ammo-options" id="ammo-options">
        <button class="ammo-btn" onclick="shootBubble(0)">-</button>
        <button class="ammo-btn" onclick="shootBubble(1)">-</button>
        <button class="ammo-btn" onclick="shootBubble(2)">-</button>
      </div>
    </div>

    <div id="feedback" style="height: 22px; font-size: 15px; font-weight: bold; margin-top: 8px;"></div>

    <!-- 圖鑑 -->
    <div class="pokedex-box">
      🏆 救援圖鑑
      <div class="pokedex-list" id="pokedex-list">尚無拯救紀錄</div>
    </div>

    <!-- 彈窗 -->
    <div class="overlay" id="overlay">
      <div id="overlay-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div style="font-size: 70px;">🐾</div>
        <h2 style="color: #3d405b; margin: 10px 0; font-size: 24px;">可愛動物泡泡救援！</h2>
        <p style="font-size: 15px; color: #6c757d; line-height: 1.6; text-align: center;">
          每破解 7 題可挑戰稀有巨型金泡泡！<br>準備好開始 5 分鐘救援任務了嗎？
        </p>
        <button class="btn-start" onclick="startGame()">開始救援！</button>
      </div>
    </div>

  </div>

  <script>
    const normalAnimals = [
      { name: "🐶 貓狗夥伴", icon: "🐶" }, { name: "🐱 貓咪", icon: "🐱" },
      { name: "🐰 飛天兔", icon: "🐰" }, { name: "🐼 功夫熊貓", icon: "🐼" },
      { name: "🦊 聰明狐狸", icon: "🦊" }, { name: "🐨 無尾熊爸", icon: "🐨" }
    ];

    const rareAnimals = [
      { name: "🦄 夢幻獨角獸", icon: "🦄" }, { name: "🐉 神秘金龍", icon: "🐉" },
      { name: "🦁 萬獸之王", icon: "🦁" }, { name: "🦚 炫彩孔雀", icon: "🦚" }
    ];

    let savedCount = 0;
    let sessionSavedCount = 0;
    let solvedCount = 0; 
    let currentAns = 0;
    let currentAnimalObj = null;
    let isBossMode = false;

    let savedPokedex = [];
    let unlockedRares = [];

    let totalSeconds = 300;
    let timerInterval = null;
    let isGameActive = false;

    function loadSave() {
      const p = localStorage.getItem('animal_pokedex_v3');
      const r = localStorage.getItem('animal_rares_v3');
      const c = localStorage.getItem('animal_count_v3');
      if (p) savedPokedex = JSON.parse(p);
      if (r) unlockedRares = JSON.parse(r);
      if (c) savedCount = parseInt(c);

      document.getElementById('saved-count').innerText = savedCount;
      updatePokedexUI();
    }

    function saveData() {
      localStorage.setItem('animal_pokedex_v3', JSON.stringify(savedPokedex));
      localStorage.setItem('animal_rares_v3', JSON.stringify(unlockedRares));
      localStorage.setItem('animal_count_v3', savedCount);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'pop') {
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'boss') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
      } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function startGame() {
      document.getElementById('overlay').style.display = 'none';
      isGameActive = true;
      sessionSavedCount = 0;
      solvedCount = 0;
      totalSeconds = 300;
      
      generateStage();
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        totalSeconds--;
        updateTimerDisplay();

        if (totalSeconds <= 0) {
          endGameTimeUp();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const mStr = mins < 10 ? '0' + mins : mins;
      const sStr = secs < 10 ? '0' + secs : secs;
      document.getElementById('time-left').innerText = `${mStr}:${sStr}`;
    }

    function endGameTimeUp() {
      clearInterval(timerInterval);
      isGameActive = false;

      confetti({ particleCount: 180, spread: 100, origin: { y: 0.5 } });

      const content = document.getElementById('overlay-content');
      
      // 根據小二解題數量決定評級 (35 隻以上金牌)
      let medalGrade = "🥉 動物救援小英雄 銅牌";
      if (sessionSavedCount >= 35) {
        medalGrade = "🥇 動物救援小英雄 金牌";
      } else if (sessionSavedCount >= 20) {
        medalGrade = "🥈 動物救援小英雄 銀牌";
      }

      let rareIconsStr = unlockedRares.length > 0 ? unlockedRares.join(' ') : '無';

      content.innerHTML = `
        <div class="medal-card">
          <div class="medal-title">${medalGrade}</div>
          <div class="medal-stat">⭐ 成功救援動物：<b>${sessionSavedCount}</b> 隻</div>
          <div class="rare-unlocked-box">
            ✨ 解鎖稀有動物：<br>
            <span style="font-size:26px;">${rareIconsStr}</span>
          </div>
        </div>

        <p style="font-size: 14px; color: #6c757d; margin-top: 8px; font-weight: 600;">
          👀 任務完成，讓眼睛休息一下吧！
        </p>

        <button class="btn-reset-time" onclick="resetTimeByParent()">家長專用：重新解鎖 5 分鐘</button>
      `;

      document.getElementById('overlay').style.display = 'flex';
    }

    function resetTimeByParent() {
      const code = prompt("請輸入家長驗證碼（請輸入 123）：");
      if (code === "123") {
        document.getElementById('overlay-content').innerHTML = `
          <div style="font-size: 70px;">🐾</div>
          <h2 style="color: #3d405b; margin: 10px 0; font-size: 24px;">可愛動物泡泡救援！</h2>
          <p style="font-size: 15px; color: #6c757d; line-height: 1.6; text-align: center;">
            已解鎖！準備好開始新的 5 分鐘冒險了嗎？
          </p>
          <button class="btn-start" onclick="startGame()">開始救援！</button>
        `;
      } else if (code !== null) {
        alert("密碼不正確喔！");
      }
    }

    function generateStage() {
      const stageBox = document.getElementById('bubble-stage');
      const targetBubble = document.getElementById('target-bubble');
      const animalEl = document.getElementById('current-animal');
      const qBox = document.getElementById('question');
      const hint = document.getElementById('sub-hint');
      const progressText = document.getElementById('stage-progress');

      // 檢查是否滿 7 題進入稀有金泡泡關
      if (solvedCount > 0 && solvedCount % 7 === 0 && !isBossMode) {
        isBossMode = true;
        playSound('boss');
      }

      if (isBossMode) {
        // --- 稀有巨型金泡泡關卡 (適合小二的三項目計算) ---
        stageBox.classList.add('boss-mode');
        targetBubble.classList.add('boss-bubble');
        animalEl.classList.add('boss-animal');
        qBox.classList.add('boss-q');
        
        currentAnimalObj = rareAnimals[Math.floor(Math.random() * rareAnimals.length)];
        animalEl.innerText = currentAnimalObj.icon;
        progressText.innerText = "⭐ 稀有大泡泡關！";
        hint.innerText = "👑 擊破巨型金泡泡，救出稀有動物！";

        // 題目類型：乘除放在最前面，由左至右計算
        const mode = Math.floor(Math.random() * 3);
        let n1, n2, n3, ans, qText;

        if (mode === 0) {
          // 乘法在前 + 加法 (例如: 3 × 8 + 15)
          n1 = Math.floor(Math.random() * 7) + 2;
          n2 = Math.floor(Math.random() * 7) + 2;
          n3 = Math.floor(Math.random() * 25) + 10;
          ans = (n1 * n2) + n3;
          qText = `${n1} × ${n2} + ${n3} = ?`;
        } else if (mode === 1) {
          // 除法在前 + 加法 (例如: 36 ÷ 4 + 20)
          n2 = Math.floor(Math.random() * 7) + 2;
          const q = Math.floor(Math.random() * 8) + 2;
          n1 = n2 * q;
          n3 = Math.floor(Math.random() * 25) + 10;
          ans = q + n3;
          qText = `${n1} ÷ ${n2} + ${n3} = ?`;
        } else {
          // 三項目連續加減 (例如: 45 + 25 - 18)
          n1 = Math.floor(Math.random() * 30) + 20;
          n2 = Math.floor(Math.random() * 20) + 10;
          n3 = Math.floor(Math.random() * 15) + 5;
          ans = n1 + n2 - n3;
          qText = `${n1} + ${n2} - ${n3} = ?`;
        }

        currentAns = ans;
        qBox.innerText = qText;

      } else {
        // --- 普通關卡 ---
        stageBox.classList.remove('boss-mode');
        targetBubble.classList.remove('boss-bubble');
        animalEl.classList.remove('boss-animal');
        qBox.classList.remove('boss-q');

        currentAnimalObj = normalAnimals[Math.floor(Math.random() * normalAnimals.length)];
        animalEl.innerText = currentAnimalObj.icon;
        
        let pNum = (solvedCount % 7) + 1;
        progressText.innerText = `進度: ${pNum}/7 題`;
        hint.innerText = "🎯 發射正確的數字泡泡拯救小動物！";

        const type = Math.floor(Math.random() * 3);
        let n1, n2, ans, qText;

        if (type === 0) {
          const isAdd = Math.random() > 0.5;
          if (isAdd) {
            n1 = Math.floor(Math.random() * 40) + 20;
            n2 = Math.floor(Math.random() * 40) + 10;
            ans = n1 + n2;
            qText = `${n1} + ${n2} = ?`;
          } else {
            n1 = Math.floor(Math.random() * 50) + 40;
            n2 = Math.floor(Math.random() * 30) + 10;
            ans = n1 - n2;
            qText = `${n1} - ${n2} = ?`;
          }
        } else if (type === 1) {
          n1 = Math.floor(Math.random() * 8) + 2;
          n2 = Math.floor(Math.random() * 8) + 2;
          ans = n1 * n2;
          qText = `${n1} × ${n2} = ?`;
        } else {
          n2 = Math.floor(Math.random() * 8) + 2;
          const q = Math.floor(Math.random() * 9) + 2;
          n1 = n2 * q;
          ans = q;
          qText = `${n1} ÷ ${n2} = ?`;
        }

        currentAns = ans;
        qBox.innerText = qText;
      }

      // 洗牌並設定三個大選項
      let options = [currentAns];
      while (options.length < 3) {
        let offset = (Math.floor(Math.random() * 6) + 1) * (Math.random() > 0.5 ? 1 : -1);
        let wrong = currentAns + offset;
        if (wrong > 0 && !options.includes(wrong)) options.push(wrong);
      }
      options.sort(() => Math.random() - 0.5);

      const btns = document.querySelectorAll('.ammo-btn');
      btns.forEach((btn, i) => {
        btn.innerText = options[i];
        btn.dataset.val = options[i];
      });
    }

    function shootBubble(btnIdx) {
      if (!isGameActive) return;

      const btns = document.querySelectorAll('.ammo-btn');
      const val = parseInt(btns[btnIdx].dataset.val);
      const feedback = document.getElementById('feedback');

      if (val === currentAns) {
        playSound('pop');
        savedCount++;
        sessionSavedCount++;
        solvedCount++;
        document.getElementById('saved-count').innerText = savedCount;

        if (isBossMode) {
          if (!unlockedRares.includes(currentAnimalObj.icon)) {
            unlockedRares.push(currentAnimalObj.icon);
          }
          confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
          feedback.style.color = '#d97706';
          feedback.innerText = `👑 啪！擊破巨金泡泡，救出 ${currentAnimalObj.name}！`;
          isBossMode = false;
        } else {
          if (!savedPokedex.includes(currentAnimalObj.icon)) {
            savedPokedex.push(currentAnimalObj.icon);
          }
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
          feedback.style.color = '#2b9348';
          feedback.innerText = `✨ 啪！成功救出 ${currentAnimalObj.name}！`;
        }
        
        saveData();
        updatePokedexUI();

        setTimeout(() => {
          feedback.innerText = '';
          if (isGameActive) generateStage();
        }, 1200);

      } else {
        playSound('wrong');
        feedback.style.color = '#e07a5f';
        feedback.innerText = '🫧 泡泡彈開了，再算一次喔！';
      }
    }

    function updatePokedexUI() {
      const list = document.getElementById('pokedex-list');
      let allIcons = [...savedPokedex, ...unlockedRares];
      if (allIcons.length === 0) {
        list.innerText = "尚無拯救紀錄";
      } else {
        list.innerHTML = allIcons.map(a => `<span>${a}</span>`).join(' ');
      }
    }

    loadSave();
  </script>
</body>
</html>
